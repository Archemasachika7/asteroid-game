<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asteroid Run</title><link rel="stylesheet" href="style.css"></head>
<body><header><h1>ASTEROID RUN</h1><div id="hud"></div></header><main><canvas id="game" aria-label="Asteroid arcade game"></canvas><section id="overlay"><h2 id="title">Ready, pilot?</h2><p id="message">Destroy the asteroids. Survive the next wave.</p><button id="start">Launch</button></section></main><footer>← → / A D: rotate · ↑ / W: thrust · Space: fire · P: pause · R: restart</footer><nav aria-label="Touch controls"><button data-key="ArrowLeft">↶</button><button data-key="ArrowUp">Thrust</button><button data-key="ArrowRight">↷</button><button data-key="Space">Fire</button><button id="pause">Pause</button></nav><script src="game.js"></script></body></html>
